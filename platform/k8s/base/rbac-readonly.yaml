# Day 3 security habit: least-privilege RBAC. Bind a learner ServiceAccount
# to this Role — they can get/list/watch, not delete production data.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: learner-ro
  namespace: secure-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: learner-ro
  namespace: secure-demo
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: learner-ro
  namespace: secure-demo
subjects:
  - kind: ServiceAccount
    name: learner-ro
    namespace: secure-demo
roleRef:
  kind: Role
  name: learner-ro
  apiGroup: rbac.authorization.k8s.io
