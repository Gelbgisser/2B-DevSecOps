# PersistentVolumeClaims for lab data (k3s local-path on the VM disk).
# Cloud: change storageClassName to the CSI class (gp3, managed-csi, …).
# Databases stay ReadWriteOnce. Do not convert these to hostPath.
# Mapping: docs/02-lab-to-cloud.md
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: secure-demo
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: secure-demo
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads-data
  namespace: secure-demo
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
