name: secure-demo

# Day 2 core stack. Only `nginx` publishes a host port.
#
# Usage (WSL, repo root):
#   cp .env.example .env
#   docker compose -f platform/compose/docker-compose.yml --env-file .env up -d --build
#
# How to read this file:
#   services:     containers (each gets a DNS name on the default network)
#   image:        pull from Docker Hub
#   build:        build from a Dockerfile in "context:"
#   ports:        HOST:CONTAINER — only nginx has this (the edge)
#   expose:       document internal ports; does NOT publish to Windows
#   volumes:      named volumes persist after "compose down" (not down -v)
#   depends_on:   start order; condition: service_healthy waits on healthcheck
#   profiles:     optional extras (clamav, cicd, vault) — not started by default
#
# Optional: --profile clamav | waf | cicd | cicd-full | vault

services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    # HOST:CONTAINER — binds 0.0.0.0 by default so a phone on LAN can reach the edge (Day 9).
    # Do not change this to 127.0.0.1:3080:80 — that would hide the API from every other device.
    ports:
      - "${NGINX_HTTP_PORT:-3080}:80"
    volumes:
      - ../docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ../docker/nginx/security:/etc/nginx/security:ro
    environment:
      APP_URL: ${APP_URL:-http://localhost:3080}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ../../apps/secure-demo/web
    expose:
      - "8080"
    restart: unless-stopped

  api:
    build:
      context: ../../apps/secure-demo/api
    expose:
      - "3001"
    environment:
      PORT: "3001"
      APP_URL: ${APP_URL:-http://localhost:3080}
      DATABASE_URL: ${DATABASE_URL:-postgres://secure_demo:lab-only-change-me@postgres:5432/secure_demo}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      DATA_DIR: /data
    volumes:
      - uploads_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 15s
    restart: unless-stopped

  worker:
    build:
      context: ../../apps/secure-demo/worker
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secure_demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab-only-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-secure_demo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secure_demo} -d ${POSTGRES_DB:-secure_demo}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # No `ports:` — DB stays on the Compose network.

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  clamav:
    profiles: ["clamav"]
    image: clamav/clamav:1.4
    volumes:
      - clamav_data:/var/lib/clamav
    expose:
      - "3310"
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc 127.0.0.1 3310 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s
    restart: unless-stopped

  gitea:
    profiles: ["cicd", "cicd-full"]
    image: gitea/gitea:1.22
    environment:
      GITEA__server__HTTP_PORT: "3000"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__admin__USERNAME: ${GITEA_ADMIN_USER:-gitea-admin}
      GITEA__admin__PASSWORD: ${GITEA_ADMIN_PASSWORD:-lab-only-gitea}
      GITEA__admin__EMAIL: gitea-admin@lab.local
    volumes:
      - gitea_data:/data
    ports:
      - "${GITEA_HTTP_PORT:-3000}:3000"
    restart: unless-stopped

  jenkins:
    profiles: ["cicd", "cicd-full"]
    image: jenkins/jenkins:lts-jdk21
    user: root
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${JENKINS_HTTP_PORT:-8090}:8080"
    restart: unless-stopped

  registry:
    profiles: ["cicd", "cicd-full"]
    image: registry:2
    volumes:
      - registry_data:/var/lib/registry
    ports:
      - "${REGISTRY_HTTP_PORT:-5000}:5000"
    restart: unless-stopped

  nexus:
    profiles: ["cicd-full"]
    image: sonatype/nexus3:3.76.0
    volumes:
      - nexus_data:/nexus-data
    ports:
      - "${NEXUS_HTTP_PORT:-8081}:8081"
    restart: unless-stopped

  vault:
    profiles: ["vault"]
    image: hashicorp/vault:1.18
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:-lab-only-vault-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: ["server", "-dev"]
    ports:
      - "${VAULT_HTTP_PORT:-8200}:8200"
    restart: unless-stopped

volumes:
  pgdata:        # Postgres — survives `compose down`, wiped by `down -v`
  redisdata:
  uploads_data:  # API quarantine/clean files (lab stand-in for object storage)
  clamav_data:
  gitea_data:
  jenkins_home:
  registry_data:
  nexus_data:
