apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
  {{- if .Values.clamav.annotation }}
  annotations:
    # Example F5 / NGINX Ingress WAF annotation (conceptual — controller not required).
    nginx.org/waf: "true"
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: api
          image: {{ .Values.image.api }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: APP_URL
              valueFrom:
                configMapKeyRef:
                  name: secure-demo
                  key: APP_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: DATABASE_URL
            - name: REDIS_URL
              value: redis://redis:6379
            - name: DATA_DIR
              value: /data
            - name: CLAMAV_HOST
              valueFrom:
                configMapKeyRef:
                  name: secure-demo
                  key: CLAMAV_HOST
          volumeMounts:
            - name: uploads
              mountPath: /data
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3001
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3001
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
        {{- if .Values.clamav.sidecar }}
        - name: clamav
          image: {{ .Values.clamav.image }}
          ports:
            - containerPort: 3310
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 1Gi
        {{- end }}
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-data
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 3001
      targetPort: 3001
