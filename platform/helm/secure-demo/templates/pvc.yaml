{{- if .Values.persistence }}
{{/* Lab: local-path. Cloud: values-cloud.yaml.example sets persistence.storageClass (gp3 / managed-csi). */}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.postgresSize }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.redisSize }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.uploadsSize }}
{{- end }}
