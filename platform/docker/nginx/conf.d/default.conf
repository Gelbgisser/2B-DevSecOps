server {
  listen 80;
  server_name _;

  # Variable upstreams: NGINX resolves these at request time via Docker DNS.
  # A plain `proxy_pass http://api:3001` is resolved ONCE at start — rebuilds → 502.
  set $upstream_web  web:8080;
  set $upstream_api  api:3001;

  include /etc/nginx/security/headers.conf;

  location = /nginx-health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location /health/ {
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Request-Id $req_id;
    proxy_set_header Connection "";
    proxy_pass http://$upstream_api;
  }

  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_http_version 1.1;
    # $http_host keeps the published port (localhost:3080). $host strips it.
    # Identity providers need the port. Use $http_host on auth routes.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Request-Id $req_id;
    proxy_set_header Connection "";
    proxy_pass http://$upstream_api;
  }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Request-Id $req_id;
    proxy_set_header Connection "";
    proxy_pass http://$upstream_web;
  }
}
