worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;

  # Correlate browser ↔ API logs (mirrors the Orqestra edge lesson).
  map $http_x_request_id $req_id {
    default   $http_x_request_id;
    ""        $request_id;
  }

  log_format json escape=json
    '{"ts":"$time_iso8601","status":$status,"method":"$request_method",'
    '"uri":"$uri","req_id":"$req_id","upstream":"$upstream_addr"}';
  access_log /var/log/nginx/access.log json;

  # Docker embedded DNS. Request-time resolver — see days/day-02 502 lab.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

  include /etc/nginx/conf.d/*.conf;
}
