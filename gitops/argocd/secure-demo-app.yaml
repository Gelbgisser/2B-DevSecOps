apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secure-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/lab/devsecops-bootcamp.git
    targetRevision: HEAD
    path: platform/helm/secure-demo
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: secure-demo
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    # Automated sync is a Day 6 exercise — leave manual on first install.
